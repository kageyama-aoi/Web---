<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>[Local Stack] Component: 円形プログレスバー</title>
<style>
  :root{
    --accent:#10B981;
    --track:#E5E7EB;
    --text:#111827;
    --muted:#6B7280;
    --node-size:34px;
    --stroke:8;
    --circle-size:60px;
    --radius:42;
    --ease:cubic-bezier(.2,.8,.2,1);
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --surface:#fff;
  }
  body{font-family:system-ui, sans-serif;background:#f7f7f8;color:var(--text);margin:0;padding:24px;}
  .phone{max-width:420px;margin:0 auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);}
  .header{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;}
  .back{width:18px;height:18px;border-left:2px solid #4b5563;border-bottom:2px solid #4b5563;transform:rotate(45deg)}
  .title{font-weight:700;font-size:18px}
  .subtitle{color:var(--muted);font-size:12px;margin-top:2px}
  .content{padding:16px}

  .circular{width:var(--circle-size);height:var(--circle-size);position:relative;display:inline-grid;place-items:center;}
  .circular svg{width:100%;height:100%;transform:rotate(-90deg)}
  .circular .track{stroke:var(--track);opacity:.85}
  .circular .bar{stroke:var(--accent);transition:stroke-dashoffset .28s var(--ease);}
  .circular .bar, .circular .track{stroke-linecap:round;fill:none;stroke-width:var(--stroke);}
  .circular .center{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;color:#059669;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .stepper{display:flex;align-items:center;gap:8px}
  .step{display:flex;flex-direction:column;align-items:center;min-width:0}
  .node{width:var(--node-size);height:var(--node-size);border-radius:999px;border:2px solid var(--track);display:grid;place-items:center;background:#fff;color:var(--muted);font-weight:700;transition:all .2s var(--ease);box-shadow:var(--shadow);}
  .node.done{background:var(--accent);color:#fff;border-color:var(--accent)}
  .node.current{border-color:var(--accent);color:#059669;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .label{margin-top:6px;font-size:11px;color:#374151;text-align:center;line-height:1.2}
  .connector{height:2px;flex:1 1 auto;background:var(--track);margin:0 2px;border-radius:2px;transition:background .2s var(--ease);}
  .connector.active{background:linear-gradient(90deg,var(--accent) 60%,var(--track) 60%)}
  .controls{display:flex;gap:8px;margin:16px}
  .btn{padding:10px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;transition:transform .1s var(--ease), background .2s var(--ease);}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
  <div class="phone" id="app">
    <div class="header">
      <span class="back"></span>
      <div>
        <div class="title">ご注文内容の確認</div>
        <div class="subtitle">お間違いないか、ご確認ください</div>
      </div>
      <div id="circular" class="circular" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3">
        <svg viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="42"></circle>
          <circle class="bar" cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="center"><span id="circleText">3/4</span></div>
      </div>
    </div>

    <div class="content">
      <div id="stepper" class="stepper" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev">戻る</button>
      <button class="btn primary" id="next">次へ</button>
    </div>
  </div>

<script>
  const state = {current:3,total:4,labels:['ご注文者情報入力','お支払い方法の指定','内容確認','注文完了']};

  const circle=document.getElementById('circular');
  const bar=circle.querySelector('.bar');
  const track=circle.querySelector('.track');
  const circleTxt=document.getElementById('circleText');

  const R=42;const CIRC=2*Math.PI*R;
  [bar,track].forEach(el=>el.setAttribute('stroke-dasharray',CIRC));

  function updateCircular(){
    const frac=Math.max(0,Math.min(1,state.current/state.total));
    const offset=CIRC*(1-frac);
    bar.setAttribute('stroke-dashoffset',offset);
    circleTxt.textContent=`${state.current}/${state.total}`;
    circle.setAttribute('aria-valuemax',state.total);
    circle.setAttribute('aria-valuenow',state.current);
  }

  const stepper=document.getElementById('stepper');
  function renderStepper(){
    stepper.innerHTML='';
    for(let i=1;i<=state.total;i++){
      const step=document.createElement('div');
      step.className='step';
      const node=document.createElement('div');
      node.className='node';
      node.textContent=i;
      if(i<state.current)node.classList.add('done');
      else if(i===state.current)node.classList.add('current');
      const label=document.createElement('div');label.className='label';label.textContent=state.labels[i-1]||`ステップ${i}`;
      step.appendChild(node);step.appendChild(label);stepper.appendChild(step);
      if(i<state.total){
        const conn=document.createElement('div');
        conn.className='connector'+(i<state.current?' active':'');
        stepper.appendChild(conn);
      }
    }
  }

  function updateAll(){updateCircular();renderStepper();}
  updateAll();

  document.getElementById('prev').onclick=()=>{state.current=Math.max(1,state.current-1);updateAll();}
  document.getElementById('next').onclick=()=>{state.current=Math.min(state.total,state.current+1);updateAll();}
</script>
</body>
</html>
