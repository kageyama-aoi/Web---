<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ整形ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom styles for resizable textarea */
        textarea.resizable {
            resize: vertical;
        }
        /* Ensure monospace font for preview */
        .font-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        // ===== Section: Constants and Initial Data =====
        const DEFAULT_INPUT_TEXT = `id - name - email - amount - date
1 - 山田太郎 - taro@example.com - 1200.5 - 2025-08-01
2 - 鈴木花子 - hanako@example.com - 980 - 2025-08-02
3 - Aoi Kageyama - aoi@example.com - 1500 - 2025-08-03
4 - テスト, カンマ - comma@example.com - 0 - 2025-08-04
5 - 改行\n混入 - linebreak@example.com - 42 - 2025-08-05
6 - ダブル\"クォート\" - quote@example.com - 77.7 - 2025-08-06
7 - タブ\t混入 - tab@example.com - 123 - 2025-08-07
8 - 記号!@#$%^&* - symbol@example.com - -1 - 2025-08-08
9 - 全角スペース　含む - zenkaku@example.com - 314 - 2025-08-09
10 - 末尾空白  - trail@example.com - 2718 - 2025-08-10`;

        const baseRows = [
            { id: 1, name: "山田太郎", email: "taro@example.com", amount: 1200.5, date: "2025-08-01" },
            { id: 2, name: "鈴木花子", email: "hanako@example.com", amount: 980, date: "2025-08-02" },
            { id: 3, name: "Aoi Kageyama", email: "aoi@example.com", amount: 1500, date: "2025-08-03" },
            { id: 4, name: "テスト, カンマ", email: "comma@example.com", amount: 0, date: "2025-08-04" },
            { id: 5, name: "改行\n混入", email: "linebreak@example.com", amount: 42, date: "2025-08-05" },
            { id: 6, name: "ダブル\"クォート\"", email: "quote@example.com", amount: 77.7, date: "2025-08-06" },
            { id: 7, name: "タブ\t混入", email: "tab@example.com", amount: 123, date: "2025-08-07" },
            { id: 8, name: "記号!@#$%^&*", email: "symbol@example.com", amount: -1, date: "2025-08-08" },
            { id: 9, name: "全角スペース　含む", email: "zenkaku@example.com", amount: 314, date: "2025-08-09" },
            { id: 10, name: "末尾空白  ", email: "trail@example.com", amount: 2718, date: "2025-08-10" }
        ];

        // ===== Section: Utility Functions =====

        // Placeholder for future encoding logic
        const encodeText = (data, encoding) => {
            // In the future, this function will re-encode the data based on the selected encoding.
            // For now, it just returns the data as is.
            console.log(`Encoding data with: ${encoding}`);
            return data;
        };

        // Function to convert line endings
        const convertLineEndings = (text, lineEnding) => {
            let convertedText = text.replace(/\r\n|\r|\n/g, '\n'); // Normalize to LF first
            switch (lineEnding) {
                case 'CRLF':
                    convertedText = convertedText.replace(/\n/g, '\r\n');
                    break;
                case 'CR':
                    convertedText = convertedText.replace(/\n/g, '\r');
                    break;
                case 'LF':
                default:
                    // Already normalized to LF
                    break;
            }
            return convertedText;
        };

        // Function to format date to YYYY/MM/DD
        const formatDate = (dateString) => {
            const date = new Date(dateString);
            if (isNaN(date)) return dateString; // Return original if invalid date
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}/${month}/${day}`;
        };

        // ===== Section: Data Transformation Logic (Placeholders) =====

        const transformData = (data, format, preset, lineEnding) => {
            let processedData = [];
            let header = [];

            // Apply preset logic to baseRows
            let currentRows = [];
            if (preset === 'mini') {
                currentRows = baseRows.slice(0, 3);
            } else if (preset === 'standard') {
                currentRows = baseRows; // All 10 rows
            } else if (preset === 'date-included') {
                // Standard rows with date formatted
                currentRows = baseRows.map(row => ({
                    ...row,
                    date: formatDate(row.date)
                }));
            } else if (preset === 'japanese-included') {
                // Standard rows with an additional Japanese column
                currentRows = baseRows.map((row, index) => ({
                    ...row,
                    note_ja: index % 2 === 0 ? "確認済み" : "要再確認"
                }));
            } else {
                // Default to input text if no specific preset for baseRows
                // For now, we'll just use baseRows for structured data
                currentRows = baseRows;
            }

            // Determine header based on currentRows and format
            if (currentRows.length > 0) {
                header = Object.keys(currentRows[0]);
            }

            // Convert structured data to target format string
            let outputString = '';
            switch (format) {
                case 'CSV':
                    // RFC4180 compliant CSV: comma-separated, double-quote escaped ("" for "), header row
                    const escapeCsv = (value) => {
                        if (value === null || value === undefined) return '';
                        let stringValue = String(value);
                        if (stringValue.includes(',') || stringValue.includes('\n') || stringValue.includes('\r') || stringValue.includes('"')) {
                            return `"${stringValue.replace(/"/g, '""')}"`;
                        }
                        return stringValue;
                    };
                    outputString += header.map(escapeCsv).join(',') + '\n';
                    outputString += currentRows.map(row => header.map(key => escapeCsv(row[key])).join(',')).join('\n');
                    break;
                case 'TSV':
                    // Tab-separated, double quotes if needed, newlines/tabs expressed
                    const escapeTsv = (value) => {
                        if (value === null || value === undefined) return '';
                        let stringValue = String(value);
                        if (stringValue.includes('\t') || stringValue.includes('\n') || stringValue.includes('\r') || stringValue.includes('"')) {
                            return `"${stringValue.replace(/"/g, '""')}"`;
                        }
                        return stringValue;
                    };
                    outputString += header.map(escapeTsv).join('\t') + '\n';
                    outputString += currentRows.map(row => header.map(key => escapeTsv(row[key])).join('\t')).join('\n');
                    break;
                case 'JSON':
                    // Formatted with 2-space indent
                    outputString = JSON.stringify(currentRows, null, 2);
                    break;
                case 'YAML':
                    // Keys snake_case (not implemented yet), Japanese quoted (not implemented yet)
                    // Simple YAML representation for now
                    outputString = currentRows.map(row => {
                        let rowYaml = '';
                        for (const key in row) {
                            let value = row[key];
                            if (typeof value === 'string' && /[\u3000-\u303F\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/.test(value)) {
                                value = `"${value}"`; // Quote Japanese
                            }
                            rowYaml += `  ${key}: ${value}\n`;
                        }
                        return `- ${rowYaml.trim()}`;
                    }).join('\n');
                    break;
                case 'XML':
                    // Root <rows>, each row <row>, type string
                    outputString = '<rows>\n';
                    outputString += currentRows.map(row => {
                        let rowXml = '  <row>\n';
                        for (const key in row) {
                            rowXml += `    <${key}>${String(row[key])}</${key}>\n`;
                        }
                        rowXml += '  </row>';
                        return rowXml;
                    }).join('\n');
                    outputString += '\n</rows>';
                    break;
                case 'Markdown':
                    // | Header | Header |
                    // |-- -|-- -|
                    // | Content | Content |
                    outputString += '| ' + header.join(' | ') + ' |\n';
                    outputString += '|' + header.map(() => '---').join('|') + '|\n';
                    outputString += currentRows.map(row => '| ' + header.map(key => String(row[key])).join(' | ') + ' |').join('\n');
                    break;
                case 'TXT':
                    // id - name - email - amount - date
                    outputString = currentRows.map(row => `${row.id} - ${row.name} - ${row.email} - ${row.amount} - ${row.date}`).join('\n');
                    break;
                case 'HTML':
                    // <table> output, same look as preview
                    outputString = '<table border="1">\n';
                    outputString += '  <thead>\n    <tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr>\n  </thead>\n';
                    outputString += '  <tbody>\n';
                    outputString += currentRows.map(row => '    <tr>' + header.map(key => `<td>${String(row[key])}</td>`).join('') + '</tr>').join('\n');
                    outputString += '\n  </tbody>\n</table>';
                    break;
                case 'SQL':
                    // CREATE TABLE IF NOT EXISTS sample (...); INSERT INTO sample (...) VALUES (...),(...);
                    // Strings single-quoted, internal ' escaped as ''
                    const tableName = 'sample';
                    const columns = header.map(h => `${h} TEXT`).join(', ');
                    outputString += `CREATE TABLE IF NOT EXISTS ${tableName} (${columns});\n`;

                    const escapeSql = (value) => {
                        if (value === null || value === undefined) return 'NULL';
                        let stringValue = String(value);
                        // Handle numbers directly, otherwise quote and escape
                        if (typeof value === 'number' && !isNaN(value)) {
                            return stringValue;
                        }
                        return `'${stringValue.replace(/'/g, "''")}'`;
                    };

                    const values = currentRows.map(row => {
                        const rowValues = header.map(key => escapeSql(row[key])).join(', ');
                        return `(${rowValues})`;
                    }).join(',\n');
                    outputString += `INSERT INTO ${tableName} (${header.join(', ')}) VALUES\n${values};`;
                    break;
                default:
                    outputString = data; // Fallback to raw input
                    break;
            }

            return convertLineEndings(outputString, lineEnding);
        };

        // ===== Section: React Component =====
        const App = () => {
            // ===== State Management =====
            const [inputText, setInputText] = React.useState(DEFAULT_INPUT_TEXT);
            const [selectedFormat, setSelectedFormat] = React.useState('TXT');
            const [selectedPreset, setSelectedPreset] = React.useState('standard');
            const [selectedLineEnding, setSelectedLineEnding] = React.useState('LF');
            const [previewText, setPreviewText] = React.useState('');
            const [downloadFileName, setDownloadFileName] = React.useState('sample_txt_standard.txt');
            const [wrapText, setWrapText] = React.useState(true);
            const [selectedEncoding, setSelectedEncoding] = React.useState('UTF-8 (BOMなし)'); // Default encoding

            // ===== Effects for Data Processing =====
            React.useEffect(() => {
                // Process data whenever inputs change
                const processed = transformData(inputText, selectedFormat, selectedPreset, selectedLineEnding);
                setPreviewText(processed);
                setDownloadFileName(`sample_${selectedFormat.toLowerCase()}_${selectedPreset.toLowerCase()}.${selectedFormat.toLowerCase() === 'markdown' ? 'md' : selectedFormat.toLowerCase() === 'html' ? 'html' : selectedFormat.toLowerCase() === 'json' ? 'json' : selectedFormat.toLowerCase() === 'sql' ? 'sql' : 'txt'}`);
            }, [inputText, selectedFormat, selectedPreset, selectedLineEnding]);

            // ===== Event Handlers =====
            const handleInputChange = (e) => {
                setInputText(e.target.value);
            };

            const handleFormatChange = (e) => {
                setSelectedFormat(e.target.value);
            };

            const handlePresetChange = (e) => {
                setSelectedPreset(e.target.value);
            };

            const handleLineEndingChange = (e) => {
                setSelectedLineEnding(e.target.value);
            };

            const handleWrapToggle = (e) => {
                setWrapText(e.target.checked);
            };

            const handleEncodingChange = (e) => {
                setSelectedEncoding(e.target.value);
                // Future: Trigger re-encoding of previewText here
                // const reEncodedText = encodeText(previewText, e.target.value);
                // setPreviewText(reEncodedText);
            };

            const handleDownload = () => {
                const finalData = encodeText(previewText, selectedEncoding); // Apply encoding before download
                const blob = new Blob([finalData], { type: `text/plain;charset=${selectedEncoding.includes('Shift_JIS') ? 'Shift_JIS' : 'utf-8'}` });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // ===== Render UI =====
            return (
                <div className="container mx-auto p-4 max-w-4xl">
                    {/* ===== Section: Selected Settings Summary ===== */}
                    <div className="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative mb-4" role="alert">
                        <strong className="font-bold">選択中の設定サマリ: </strong>
                        <span className="block sm:inline">
                            フォーマット: <span className="font-semibold">{selectedFormat}</span> |
                            プリセット: <span className="font-semibold">{selectedPreset}</span> |
                            改行コード: <span className="font-semibold">{selectedLineEnding}</span> |
                            文字エンコーディング: <span className="font-semibold">{selectedEncoding}</span>
                        </span>
                    </div>

                    {/* ===== Section: Input Area ===== */}
                    <h2 className="text-xl font-bold mb-2">入力データ</h2>
                    <textarea
                        className="w-full p-2 border border-gray-300 rounded-md resizable"
                        rows="10"
                        value={inputText}
                        onChange={handleInputChange}
                        placeholder="ここにデータを入力してください..."
                    ></textarea>

                    {/* ===== Section: Controls ===== */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        {/* Format Selection */}
                        <div>
                            <h3 className="font-semibold mb-2">フォーマット選択:</h3>
                            {['CSV', 'TSV', 'JSON', 'YAML', 'XML', 'Markdown', 'TXT', 'HTML', 'SQL'].map(format => (
                                <div key={format} className="flex items-center">
                                    <input
                                        type="radio"
                                        id={`format-${format}`}
                                        name="format"
                                        value={format}
                                        checked={selectedFormat === format}
                                        onChange={handleFormatChange}
                                        className="mr-2"
                                    />
                                    <label htmlFor={`format-${format}`}>{format}</label>
                                </div>
                            ))}
                        </div>

                        {/* Preset Selection */}
                        <div>
                            <h3 className="font-semibold mb-2">プリセット選択:</h3>
                            <select
                                className="w-full p-2 border border-gray-300 rounded-md"
                                value={selectedPreset}
                                onChange={handlePresetChange}
                            >
                                <option value="mini">ミニ（3行）</option>
                                <option value="standard">標準（10行）</option>
                                <option value="date-included">日付入り（YYYY/MM/DD）</option>
                                <option value="japanese-included">日本語入り</option>
                            </select>
                        </div>

                        {/* Line Ending Selection */}
                        <div>
                            <h3 className="font-semibold mb-2">改行コード選択:</h3>
                            {['LF', 'CRLF', 'CR'].map(le => (
                                <div key={le} className="flex items-center">
                                    <input
                                        type="radio"
                                        id={`line-ending-${le}`}
                                        name="lineEnding"
                                        value={le}
                                        checked={selectedLineEnding === le}
                                        onChange={handleLineEndingChange}
                                        className="mr-2"
                                    />
                                    <label htmlFor={`line-ending-${le}`}>{le} ({le === 'LF' ? '\n' : le === 'CRLF' ? '\r\n' : '\r'})</label>
                                </div>
                            ))}
                        </div>

                        {/* Encoding Selection */}
                        <div>
                            <h3 className="font-semibold mb-2">文字エンコーディング選択:</h3>
                            {['UTF-8 (BOMなし)', 'UTF-8 (BOMあり)', 'Shift_JIS'].map(encoding => (
                                <div key={encoding} className="flex items-center">
                                    <input
                                        type="radio"
                                        id={`encoding-${encoding}`}
                                        name="encoding"
                                        value={encoding}
                                        checked={selectedEncoding === encoding}
                                        onChange={handleEncodingChange}
                                        className="mr-2"
                                    />
                                    <label htmlFor={`encoding-${encoding}`}>{encoding}</label>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ===== Section: Preview Area ===== */}
                    <h2 className="text-xl font-bold mt-4 mb-2">プレビュー</h2>
                    <div className="flex items-center mb-2">
                        <input
                            type="checkbox"
                            id="wrap-toggle"
                            checked={wrapText}
                            onChange={handleWrapToggle}
                            className="mr-2"
                        />
                        <label htmlFor="wrap-toggle">テキストの折り返し</label>
                    </div>
                    <textarea
                        className={`w-full p-2 border border-gray-300 rounded-md resizable font-mono ${wrapText ? 'whitespace-pre-wrap' : 'whitespace-pre'}`}
                        rows="15"
                        value={previewText}
                        readOnly
                    ></textarea>

                    {/* ===== Section: Download Button ===== */}
                    <div className="mt-4">
                        <button
                            onClick={handleDownload}
                            className="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
                        >
                            ダウンロード ({downloadFileName})
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
