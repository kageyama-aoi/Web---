<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>サンプルファイル生成アプリ（統合版）</title>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.1.0/encoding.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ボタンの操作感を向上させるスタイル */
    .btn {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn.primary {
      /* プライマリボタンには少し影をつけて立体感を出す */
      box-shadow: 0 2px 5px rgba(0, 90, 210, 0.2);
    }
    .btn:hover {
      /* ホバー時に少し浮き上がる */
      transform: translateY(-1px);
    }
    .btn:active {
      /* クリック時に沈み込む */
      transform: translateY(1px);
      /* 影を消して、押された感を強調 */
      box-shadow: none;
      filter: brightness(0.95);
    }
  </style>
</head>
<body>
  <header>
    <h1>🧪 サンプルファイル生成アプリ（統合版） <span class="small muted">CSV / TSV / JSON / YAML / XML / Markdown / TXT / HTML / SQL / 固定長（EDI対応）</span></h1>
  </header>

  <div class="wrap">
    <!-- Left controls -->
    <div class="card">
      <h2>⚙️ 設定</h2>
      <form class="body grid" id="settingsForm">
        <div class="row">
          <label for="preset">プリセット</label>
          <select id="preset" name="preset">
            <option value="1600_19_1">1600_19_1｜講師謝礼追加</option>
            <option value="2000_1_1" selected>2000_1_1｜EDI新規会員データ取込</option>
            <option value="4000_3_1">4000_3_1｜SMBC買取状態読込（ダミー）</option>
          </select>
        </div>

        <fieldset class="row">
          <legend>フォーマット</legend>
          <div class="flex" id="fmtGroup">
            <label class="switch" for="fmt_csv"><input type="radio" name="fmt" value="CSV" id="fmt_csv">CSV</label>
            <label class="switch" for="fmt_tsv"><input type="radio" name="fmt" value="TSV" id="fmt_tsv">TSV</label>
            <label class="switch" for="fmt_json"><input type="radio" name="fmt" value="JSON" id="fmt_json">JSON</label>
            <label class="switch" for="fmt_yaml"><input type="radio" name="fmt" value="YAML" id="fmt_yaml">YAML</label>
            <label class="switch" for="fmt_xml"><input type="radio" name="fmt" value="XML" id="fmt_xml">XML</label>
            <label class="switch" for="fmt_md"><input type="radio" name="fmt" value="Markdown" id="fmt_md">MD</label>
            <label class="switch" for="fmt_txt"><input type="radio" name="fmt" value="TXT" id="fmt_txt">TXT</label>
            <label class="switch" for="fmt_html"><input type="radio" name="fmt" value="HTML" id="fmt_html">HTML</label>
            <label class="switch" for="fmt_sql"><input type="radio" name="fmt" value="SQL" id="fmt_sql">SQL</label>
            <label class="switch" for="fmt_fixed"><input type="radio" name="fmt" value="FIXED" id="fmt_fixed" checked>固定長</label>
          </div>
        </fieldset>

        <fieldset class="row">
          <legend>区切り</legend>
          <div class="flex">
            <label class="switch" for="delim_comma"><input type="radio" name="delim" value="," id="delim_comma" checked>,（カンマ）</label>
            <label class="switch" for="delim_tab"><input type="radio" name="delim" value="\t" id="delim_tab">\t（タブ）</label>
          </div>
        </fieldset>

        <fieldset class="row">
          <legend>ヘッダ行</legend>
          <div class="flex">
            <label class="switch" for="withHeader"><input type="checkbox" id="withHeader" name="withHeader" checked>出力にヘッダを含める</label>
          </div>
        </fieldset>

        <fieldset class="row">
          <legend>改行コード</legend>
          <div class="flex">
            <label class="switch" for="nl_lf"><input type="radio" name="nl" value="LF" id="nl_lf" checked>LF (\n)</label>
            <label class="switch" for="nl_crlf"><input type="radio" name="nl" value="CRLF" id="nl_crlf">CRLF (\r\n)</label>
            <label class="switch" for="nl_cr"><input type="radio" name="nl" value="CR" id="nl_cr">CR (\r)</label>
          </div>
        </fieldset>

        <fieldset class="row">
          <legend>文字コード</legend>
          <div class="flex">
            <label class="switch" for="enc_utf8" id="label_enc_utf8"><input type="radio" name="enc" value="UTF-8" id="enc_utf8" checked>UTF-8</label>
            <label class="switch" for="enc_sjis" id="label_enc_sjis"><input type="radio" name="enc" value="SJIS" id="enc_sjis">Shift-JIS</label>
          </div>
        </fieldset>

        <div class="row">
          <label>プレビュー</label>
          <div class="flex">
            <button type="button" class="btn" id="btnPreview">再生成</button>
            <button type="button" class="btn primary" id="btnDownload">ダウンロード</button>
          </div>
        </div>

        <div class="grid small muted">
          <div>ヒント：<span class="kbd">固定長</span> は 2000_1_1 のとき <span class="hl">EDI仕様（100桁・ヘッダ/データ/トレーラー/エンド）</span> を自動適用します。</div>
        </div>
      </form>
      <div class="foot small">v0.2 – 統合版 / EDI対応・TSV/CSV/他各形式</div>
    </div>

    <!-- Right panel -->
    <div class="card">
      <h2>🧾 出力プレビュー</h2>
      <div class="body grid">
        <div class="stat">
          <span class="pill">ファイル名: <span id="fileName" class="mono"></span></span>
          <span class="pill">サイズ: <span id="fileSize" class="mono"></span></span>
          <span class="pill">行数: <span id="lineCount" class="mono"></span></span>
        </div>
        <textarea id="preview" class="mono" spellcheck="false" aria-label="出力プレビュー"></textarea>

        <div id="panelChecks" class="grid">
          <div class="small muted">メタチェック（先頭レコード基準）</div>
          <div id="checksArea"></div>
        </div>

        <div id="panelWarn" class="grid" style="display:none">
          <div class="small warn">⚠️ バリデーション警告（EDI）</div>
          <div id="warnArea" class="mono small"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module" src="src/script.js"></script>
</body>
</html>
